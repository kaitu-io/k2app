name: Release k2/k2s

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      # kuic lives at third_party/kuic (private repo kaitu-io/kuic). The default
      # GITHUB_TOKEN can't read it, so load a read-only deploy key and init the
      # submodule over SSH before the Go build touches it.
      - name: Load kuic submodule deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KUIC_DEPLOY_KEY }}
      - name: Init submodules (kuic)
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init --recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=${TAG_REF#refs/tags/v}" >> "$GITHUB_ENV"
          fi
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT"
          TAGS=""  # Desktop: lock-ordering detection enabled (mobile uses deadlock_disable in Makefile)
          mkdir -p build
          go build $TAGS -ldflags "$LDFLAGS" -o "build/k2s-${GOOS}-${GOARCH}" ./cmd/k2s
          go build $TAGS -ldflags "$LDFLAGS" -o "build/k2-${GOOS}-${GOARCH}" ./cmd/k2

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=${TAG_REF#refs/tags/v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Generate checksums and upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-east-1
          S3_BUCKET: s3://d0.all7.cc/kaitu/k2
        run: scripts/release.sh "$VERSION"

      - name: Notify Slack
        if: success()
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_RELEASE }}
        run: |
          [ -n "$SLACK_URL" ] && curl -s -X POST "$SLACK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"k2 $VERSION released\"}" || true
