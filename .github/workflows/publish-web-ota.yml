name: Publish Web OTA

# Web OTA publish pipeline (spec: docs/superpowers/specs/2026-08-14-web-ota-design.md §6,
# amended 2026-09-12 §6.1 — anti-rollback gate; 2026-09-18 — dedicated tag + per-brand).
# Two entry points:
#   push tag webapp/x.y.z[-brand] → stable, fully automatic. Bare = BOTH brands;
#     a `-kaitu` / `-overleap` suffix narrows to one (web-ota-plan.mjs). The
#     tag's x.y.z must match package.json. This is the ONLY automatic path — an
#     app release (a v* tag) NO LONGER publishes web OTA (the old linkage tail is
#     gone); a web bundle reaches clients only when its own webapp/* tag is pushed.
#   workflow_dispatch → republish any ref (emergency rollback via ref=<known-good sha>),
#     pick brand(s), and/or target the beta channel (bootstrap §8 does beta first),
#     and/or publish into a UAT `namespace` that no shipped client polls
#
# The beta CHANNEL is not a safe UAT target: shipped 0.4.7 mobile applies web
# bundles silently (no minisign, no min_bridge, no prompt on that version), so
# anything landing on beta/latest.json reaches real beta devices. `namespace`
# exists because the isolation has to come from the PATH, not the channel.
# Stable publishes update BOTH channel manifests; artifacts always also land in the
# beta dir so the manifest's relative url ({version}/web.zip) resolves on either
# channel — same superset semantics as scripts/publish-mobile.sh.
#
# JOB SHAPE (why five jobs and not one)
# -------------------------------------
# `{brand}/web/latest.json` is a single global mutable pointer and the 4th version
# segment is time-based, so a bundle built from an OLD commit still outranks what
# is live and wins. A `webapp/*` tag can be cut from a release branch that lags
# main, so the pipeline has to be able to say "this publish would move stable
# backwards" — per brand, since the two brands publish INDEPENDENTLY now.
#
#   plan     → ref/brand input → the brand set (kaitu / overleap / both) + version
#   precheck → cheap fail-fast gate (advisory) + tag/version validation
#   build    → tests, the target brands' bundles, minisign, manifests → artifacts
#   publish  → AUTHORITATIVE gate + S3 upload + provenance + CDN invalidation,
#              all inside the `publish-web-ota` concurrency group
#   notify-failure → one place that alerts, so a failed gate cannot be silent
#
# The authoritative gate MUST sit in the same job as the upload, and that job
# must be the one holding the concurrency group. A separate gate job would let
# two queued runs interleave (gate A, gate B, upload A, upload B) and B's gate
# would read provenance written before A published — turning the comparison into
# a coin flip. Keeping gate+upload atomic under the group is what makes the
# no-downgrade property hold under concurrency.

on:
  push:
    # The ONE automatic trigger. `webapp/x.y.z` = both brands; `webapp/x.y.z-kaitu`
    # / `-overleap` = one brand. The glob's `*` does not span `/`, so a brand
    # suffix (no extra slash) matches without touching this pattern. The `plan`
    # job resolves the brand set + version from the ref via web-ota-plan.mjs.
    tags: ['webapp/*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA / branch to build and publish (emergency republish / rollback)'
        required: false
        default: 'main'
      brand:
        description: 'Which brand(s) to publish'
        type: choice
        options: [both, kaitu, overleap]
        default: both
      channel:
        description: 'Release channel'
        type: choice
        options: [stable, beta]
        default: stable
      namespace:
        description: "UAT namespace — publishes under {brand}/web/{ns}/web/ instead of {brand}/web/. Empty = production. Nothing shipped polls it; pair with desktop K2_WEB_OTA_BASE=https://d0.all7.cc/{brand}/web/{ns} to exercise the live chain without an audience."
        required: false
        default: ''
      allow_rollback:
        description: >-
          Publish even though the ref is BEHIND or DIVERGED from the bundle that
          is live (spec §7 emergency republish). Without this, such a publish is
          refused. It does NOT override an unreadable provenance record — that
          stays fail-closed, because it is blindness, not intent.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # Production web bundles ship at info level (same rule as release-desktop.yml).
  K2_BUILD_LOG_LEVEL: info
  AWS_DEFAULT_REGION: ap-northeast-1
  # ONE bucket literal for both the gate (which reads what is live) and the
  # upload (which replaces it). Two literals could drift, and the drift would be
  # invisible in the worst direction: the gate reading an empty prefix answers
  # "nothing is live, publish away" while the upload still overwrites the real
  # tree. Shared, a wrong bucket cannot make the gate blind without also making
  # the upload fail loudly. scripts/ci/web-ota-gate.mjs documents the rest of
  # that argument.
  WEB_OTA_BUCKET: d0.all7.cc
  # Single source of truth for the gate's inputs, shared by the two gate steps so
  # the advisory and authoritative evaluations cannot drift apart. (No mode: the
  # gate has one path now — every publish is explicit. The v* app-release linkage
  # that needed a second mode was removed when web OTA moved to its own tag.)
  GATE_ALLOW_ROLLBACK: ${{ (inputs.allow_rollback == true || inputs.allow_rollback == 'true') && 'true' || 'false' }}
  GATE_CHANNEL: ${{ inputs.channel || 'stable' }}
  GATE_NAMESPACE: ${{ inputs.namespace || '' }}

jobs:
  # -------------------------------------------------------------------- plan --
  # The tag (or the dispatch `brand` input) decides which brand(s) publish. Same
  # -kaitu / -overleap / bare=both scoping as an app release (web-ota-plan.mjs),
  # so the brand set flows into every downstream job's brand loop and into the
  # gate's --brands (which reads only the brands being published).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      brands: ${{ steps.plan.outputs.brands }}
      tag_version: ${{ steps.plan.outputs.tag_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_BRAND: ${{ inputs.brand }}
        run: |
          set -euo pipefail
          # Always pass --ref (it supplies tag_version even on a dispatch whose
          # ref is a webapp/* tag); a dispatch adds --brand, which overrides the
          # brand set from that ref.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PLAN=$(node scripts/ci/web-ota-plan.mjs --ref "$REF_NAME" --brand "${IN_BRAND:-both}")
          else
            PLAN=$(node scripts/ci/web-ota-plan.mjs --ref "$REF_NAME")
          fi
          echo "$PLAN"
          grep -E '^(brands|tag_version)=' <<<"$PLAN" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- precheck --
  # Cheap and first: a release-branch tag that would downgrade stable is caught
  # in ~40s instead of after a 15-minute build. Advisory only — the decision
  # that gates the upload is re-made in `publish` under the concurrency group
  # (see JOB SHAPE above).
  precheck:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      relation: ${{ steps.gate.outputs.relation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
          # The gate compares commits by git ancestry, so it needs real history.
          # A shallow clone makes every comparison "unresolvable", which is
          # fail-closed but useless.
          fetch-depth: 0

      # The tag version is the ref minus `webapp/` AND minus the brand suffix
      # (web-ota-plan.mjs) — a bare `${GITHUB_REF_NAME#webapp/}` strip would fail
      # for `webapp/x.y.z-overleap`. package.json stays the version source of truth.
      - name: Validate webapp tag against package.json
        if: startsWith(github.ref, 'refs/tags/webapp/')
        env:
          TAG_VER: ${{ needs.plan.outputs.tag_version }}
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag webapp/${TAG_VER} does not match package.json version ${PKG_VER} — package.json is the version source of truth; bump it or retag"
            exit 1
          fi

      - name: Gate — would this publish move stable backwards? (advisory)
        id: gate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BRANDS: ${{ needs.plan.outputs.brands }}
        run: |
          set -euo pipefail
          node scripts/ci/web-ota-gate.mjs \
            --stage precheck \
            --brands "$BRANDS" \
            --publish-commit "$(git rev-parse HEAD)" \
            --allow-rollback "$GATE_ALLOW_ROLLBACK" \
            --channel "$GATE_CHANNEL" \
            --namespace "$GATE_NAMESPACE" \
            --bucket "$WEB_OTA_BUCKET"

  # ------------------------------------------------------------------- build --
  build:
    needs: [plan, precheck]
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      # The brand set (from the tag suffix / dispatch input) drives every loop
      # below — tests, builds, smoke, packaging — so a single-brand tag never
      # touches the other brand. Exported once to $GITHUB_ENV for all later steps.
      - name: Resolve brands
        env:
          PLAN_BRANDS: ${{ needs.plan.outputs.brands }}
        run: echo "BRANDS=$PLAN_BRANDS" >> "$GITHUB_ENV"

      # This job runs webapp `yarn test`, which includes the fail-closed
      # engine-error-code gate (webapp/src/services/__tests__/
      # k2-engine-codes.test.ts) — it THROWS if k2/engine/error.go is absent
      # rather than skipping. k2 is a private submodule, so without this init
      # `yarn test` fails "error.go not found". The reusable webapp test job
      # inits k2 for the same reason; this workflow calls `yarn test` directly
      # and must do it too. Only k2 itself is needed (one Go file) — no
      # --recursive, no kuic key. secrets.K2_DEPLOY_KEY is a repo secret,
      # available on both entry paths (tag push and workflow_dispatch).
      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.K2_DEPLOY_KEY }}

      - name: Init k2 submodule (webapp engine error-code gate reads k2/engine/error.go)
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init k2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Bridge-contract gate per brand being published (K2_BRAND=kaitu is the
      # default value, set explicitly so the loop is uniform).
      - name: Webapp tests incl. bridge contract gate (per brand)
        run: |
          set -euo pipefail
          for BRAND in $BRANDS; do
            echo "::group::webapp tests ($BRAND)"
            K2_BRAND="$BRAND" yarn test
            echo "::endgroup::"
          done
        working-directory: webapp

      # Manifest generator + plan + anti-rollback gate unit tests. They also run
      # in ci.yml on every push, but this path must not depend on that having
      # happened: a dispatch can publish any ref.
      - name: CI script unit tests (manifest generator + plan + anti-rollback gate)
        run: |
          node --test scripts/ci/web-ota-manifest.test.mjs
          node --test scripts/ci/web-ota-plan.test.mjs
          node --test scripts/ci/web-ota-gate.test.mjs

      - name: Build webapp bundles + brand purity gate (per brand)
        run: |
          set -euo pipefail
          for BRAND in $BRANDS; do
            echo "::group::build ($BRAND)"
            K2_BRAND="$BRAND" yarn build
            bash scripts/check-brand-purity.sh "$BRAND" dist
            mv dist "dist-$BRAND"
            echo "::endgroup::"
          done
        working-directory: webapp

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: webapp

      - name: White-screen smoke gate (per brand)
        run: |
          set -euo pipefail
          for BRAND in $BRANDS; do
            node webapp/scripts/smoke-dist.mjs "webapp/dist-$BRAND"
          done

      - name: Derive version
        id: ver
        run: |
          VERSION="$(node scripts/ci/web-ota-manifest.mjs version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Web OTA version: $VERSION"

      - name: Package + minisign + manifest (per brand)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign zip unzip
          VERSION='${{ steps.ver.outputs.version }}'
          # Same base64-encoded minisign key that signs desktop updater artifacts
          # (release-desktop.yml "Sign Linux tarballs" step is the precedent).
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/minisign.key
          mkdir -p out
          for BRAND in $BRANDS; do
            (cd "webapp/dist-$BRAND" && zip -qr "../../out/web-$BRAND.zip" .)
            # zip top level must BE the dist content (spec §3.3): index.html at root.
            unzip -l "out/web-$BRAND.zip" | grep -qE '(^|\s)index\.html$' \
              || { echo "::error::web-$BRAND.zip missing top-level index.html"; exit 1; }
            echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s /tmp/minisign.key -m "out/web-$BRAND.zip"
            node scripts/ci/web-ota-manifest.mjs manifest \
              --version "$VERSION" \
              --zip "out/web-$BRAND.zip" \
              --sig-file "out/web-$BRAND.zip.minisig" \
              --out "out/latest-$BRAND.json"
            cat "out/latest-$BRAND.json"
          done
          rm -f /tmp/minisign.key

      # Handing the signed bundles to a separate job keeps the serialized
      # critical section (gate + upload) down to ~1 minute instead of holding
      # the concurrency group through a 15-minute build.
      - name: Upload bundles for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: web-ota-bundles
          path: out/
          retention-days: 7
          if-no-files-found: error

  # ----------------------------------------------------------------- publish --
  publish:
    needs: [plan, precheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-web-ota
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      # Drives the gate's --brands, the upload loop and the CDN invalidation, so
      # a single-brand tag reads, uploads and invalidates only its own brand.
      - name: Resolve brands
        env:
          PLAN_BRANDS: ${{ needs.plan.outputs.brands }}
        run: echo "BRANDS=$PLAN_BRANDS" >> "$GITHUB_ENV"

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: web-ota-bundles
          path: out/

      - name: Resolve publish commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # THE load-bearing gate. Re-evaluated here, inside the concurrency group
      # and immediately before the upload, so a run that queued behind another
      # publish sees that publish's provenance rather than a pre-queue snapshot.
      # --brands is the target set only: publishing one brand never gates on the
      # other's provenance (they release independently now).
      - name: Gate — would this publish move stable backwards? (authoritative)
        id: gate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/web-ota-gate.mjs \
            --stage publish \
            --brands "$BRANDS" \
            --publish-commit '${{ steps.commit.outputs.sha }}' \
            --allow-rollback "$GATE_ALLOW_ROLLBACK" \
            --channel "$GATE_CHANNEL" \
            --namespace "$GATE_NAMESPACE" \
            --bucket "$WEB_OTA_BUCKET"

      # notify=true means a DELIBERATE backwards publish (allow_rollback on an
      # unsafe relation) — stable is moving to an older commit on purpose. A
      # refusal is already loud (red run + notify-failure); this is the one green
      # outcome that still warrants a heads-up.
      - name: Notify Slack that stable moved backwards (allow_rollback)
        if: steps.gate.outputs.notify == 'true'
        run: |
          ./scripts/ci/notify-slack.sh notice \
            --platform "Publish Web OTA" \
            --error "Web OTA stable moved BACKWARDS via allow_rollback (${{ steps.gate.outputs.relation }}): ${{ steps.gate.outputs.reason }}"
        env:
          SLACK_WEBHOOK_ALERT: ${{ secrets.SLACK_WEBHOOK_ALERT }}

      - name: Upload to S3 + publish manifests + record provenance
        if: steps.gate.outputs.proceed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PUBLISH_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.build.outputs.version }}'
          CHANNEL="$GATE_CHANNEL"
          NS="$GATE_NAMESPACE"
          # The namespace nests INSIDE {brand}/web/, not above {brand}/. The
          # first shape tried was {ns}/{brand}/web/ and S3 refused it:
          #   AccessDenied ... user/k2app-ci-s3 is not authorized to perform
          #   s3:PutObject on "d0.all7.cc/uat/kaitu/web/..."
          # The CI IAM user is scoped to the known brand subtrees — a second,
          # independent guard on where a publish can land. Widening that policy
          # to make UAT convenient would spend a real safety property on a test
          # convenience, so the path bends to the policy instead.
          #
          # Result: {brand}/web/{ns}/web/{latest.json,{version}/web.zip}. The
          # doubled `web` is not a typo — the desktop override appends
          # `web/latest.json` to whatever base it is given (channel.rs
          # ota_sources_for), so the base handed to K2_WEB_OTA_BASE is
          # .../{brand}/web/{ns} and CI must place the tree one level under it.
          #
          # Collision with production is impossible by construction: production
          # is {brand}/web/ and every namespaced path carries a non-empty extra
          # segment. Nothing shipped polls {brand}/web/{ns}/... — clients poll
          # only {brand}/web/latest.json and {brand}/web/beta/latest.json.
          if [ -n "$NS" ]; then
            case "$NS" in
              *[!a-z0-9-]*|-*|beta|web)
                echo "::error::namespace must match [a-z0-9-]+, not start with '-', and not be 'beta' or 'web' (got '$NS')"
                exit 1 ;;
            esac
            PREFIX_SUFFIX="/${NS}/web"
            echo "::warning::UAT publish into namespace '$NS' — production paths are NOT touched"
          else
            PREFIX_SUFFIX=""
          fi
          echo "Publishing v$VERSION from $PUBLISH_COMMIT to channel: $CHANNEL for brands: $BRANDS (base: s3://${WEB_OTA_BUCKET}/{brand}/web${PREFIX_SUFFIX})"
          for BRAND in $BRANDS; do
            BASE="s3://${WEB_OTA_BUCKET}/${BRAND}/web${PREFIX_SUFFIX}"
            node scripts/ci/web-ota-manifest.mjs source \
              --version "$VERSION" \
              --commit "$PUBLISH_COMMIT" \
              --brand "$BRAND" \
              --ref "${GITHUB_REF_NAME:-}" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --workflow "${GITHUB_WORKFLOW:-}" \
              --out "out/source-$BRAND.json"
            # Order within each channel is load-bearing: zip → manifest →
            # provenance pointer. Provenance is what the gate reads, so writing
            # it before the manifest would let a half-failed publish claim a
            # commit that is not actually being served, and a later forward
            # publish would then compare against that false provenance. Written
            # last, a half-failed publish just looks like "not published yet",
            # which the next forward publish heals.
            aws s3 cp "out/web-$BRAND.zip" "$BASE/beta/${VERSION}/web.zip" --content-type application/zip
            aws s3 cp "out/source-$BRAND.json" "$BASE/beta/${VERSION}/source.json" --content-type application/json
            aws s3 cp "out/latest-$BRAND.json" "$BASE/beta/latest.json" --content-type application/json
            aws s3 cp "out/source-$BRAND.json" "$BASE/beta/latest-source.json" --content-type application/json
            if [ "$CHANNEL" = "stable" ]; then
              aws s3 cp "out/web-$BRAND.zip" "$BASE/${VERSION}/web.zip" --content-type application/zip
              aws s3 cp "out/source-$BRAND.json" "$BASE/${VERSION}/source.json" --content-type application/json
              aws s3 cp "out/latest-$BRAND.json" "$BASE/latest.json" --content-type application/json
              aws s3 cp "out/source-$BRAND.json" "$BASE/latest-source.json" --content-type application/json
            fi
          done

      - name: Invalidate CloudFront (both distributions)
        if: steps.gate.outputs.proceed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Only the published brand(s): a single-brand publish must not spend an
          # invalidation on the brand it did not touch. A namespaced publish lands
          # under {brand}/web/{ns}/, which the production wildcard /{brand}/web/*
          # already covers — so the paths need no namespace handling at all.
          PATHS=()
          for BRAND in $BRANDS; do PATHS+=("/${BRAND}/web/*"); done
          for DIST_ID in E3W144CRNT652P E34P52R7B93FSC; do
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "${PATHS[@]}" \
              --no-cli-pager --output text > /dev/null
          done
          echo "CDN invalidated: d0.all7.cc + dl.kaitu.io (${PATHS[*]})"

  # ----------------------------------------------------------------- notify ---
  # A refused or broken publish is otherwise silent except for a red run nobody
  # is watching. One job across all upstreams (plan / precheck / build / publish)
  # so a refusal in `precheck` — or a bad tag in `plan` — alerts too: with the
  # notify living inside `publish`, an earlier-job failure would skip it entirely.
  notify-failure:
    needs: [plan, precheck, build, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify Slack on publish failure
        run: |
          ./scripts/ci/notify-slack.sh build-failure \
            --platform "Publish Web OTA" \
            --error "Web OTA publish failed (event: ${{ github.event_name }}, ref: ${{ github.ref_name }}). Check workflow run for details."
        env:
          SLACK_WEBHOOK_ALERT: ${{ secrets.SLACK_WEBHOOK_ALERT }}
