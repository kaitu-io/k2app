name: Publish Web OTA

# Web OTA publish pipeline (spec: docs/superpowers/specs/2026-08-14-web-ota-design.md §6).
# Three entry points:
#   push tag webapp/x.y.z → stable, fully automatic (tag version must match package.json)
#   workflow_call → invoked by app-release workflows to piggyback a web OTA publish on
#     an app release; caller passes `channel` (default stable) and `secrets: inherit`
#   workflow_dispatch → republish any ref (emergency rollback via ref=<known-good sha>)
#     and/or target the beta channel (bootstrap §8 does beta first), and/or
#     publish into a UAT `namespace` that no shipped client polls
#
# The beta CHANNEL is not a safe UAT target: shipped 0.4.7 mobile applies web
# bundles silently (no minisign, no min_bridge, no prompt on that version), so
# anything landing on beta/latest.json reaches real beta devices. `namespace`
# exists because the isolation has to come from the PATH, not the channel.
# Stable publishes update BOTH channel manifests; artifacts always also land in the
# beta dir so the manifest's relative url ({version}/web.zip) resolves on either
# channel — same superset semantics as scripts/publish-mobile.sh.

on:
  push:
    tags: ['webapp/*']
  workflow_call:
    inputs:
      channel:
        description: 'Release channel'
        type: string
        default: 'stable'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA / branch to build and publish (emergency republish / rollback)'
        required: false
        default: 'main'
      channel:
        description: 'Release channel'
        type: choice
        options: [stable, beta]
        default: stable
      namespace:
        description: "UAT namespace — publishes under {brand}/web/{ns}/web/ instead of {brand}/web/. Empty = production. Nothing shipped polls it; pair with desktop K2_WEB_OTA_BASE=https://d0.all7.cc/{brand}/web/{ns} to exercise the live chain without an audience."
        required: false
        default: ''

permissions:
  contents: read

env:
  # Production web bundles ship at info level (same rule as release-desktop.yml).
  K2_BUILD_LOG_LEVEL: info
  AWS_DEFAULT_REGION: ap-northeast-1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-web-ota
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Validate webapp tag against package.json
        if: startsWith(github.ref, 'refs/tags/webapp/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#webapp/}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag webapp/${TAG_VER} does not match package.json version ${PKG_VER} — package.json is the version source of truth; bump it or retag"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Webapp tests incl. bridge contract gate (kaitu)
        run: yarn test
        working-directory: webapp

      - name: Webapp tests incl. bridge contract gate (overleap)
        run: yarn test
        working-directory: webapp
        env:
          K2_BRAND: overleap

      - name: Manifest generator unit tests
        run: node --test scripts/ci/web-ota-manifest.test.mjs

      - name: Build webapp (kaitu) + brand purity gate
        run: |
          yarn build
          bash scripts/check-brand-purity.sh kaitu dist
          mv dist dist-kaitu
        working-directory: webapp

      - name: Build webapp (overleap) + brand purity gate
        run: |
          yarn build
          bash scripts/check-brand-purity.sh overleap dist
          mv dist dist-overleap
        working-directory: webapp
        env:
          K2_BRAND: overleap

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: webapp

      - name: White-screen smoke gate (both brands)
        run: |
          node webapp/scripts/smoke-dist.mjs webapp/dist-kaitu
          node webapp/scripts/smoke-dist.mjs webapp/dist-overleap

      - name: Derive version
        id: ver
        run: |
          VERSION="$(node scripts/ci/web-ota-manifest.mjs version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Web OTA version: $VERSION"

      - name: Package + minisign + manifest (both brands)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign zip unzip
          VERSION='${{ steps.ver.outputs.version }}'
          # Same base64-encoded minisign key that signs desktop updater artifacts
          # (release-desktop.yml "Sign Linux tarballs" step is the precedent).
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/minisign.key
          mkdir -p out
          for BRAND in kaitu overleap; do
            (cd "webapp/dist-$BRAND" && zip -qr "../../out/web-$BRAND.zip" .)
            # zip top level must BE the dist content (spec §3.3): index.html at root.
            unzip -l "out/web-$BRAND.zip" | grep -qE '(^|\s)index\.html$' \
              || { echo "::error::web-$BRAND.zip missing top-level index.html"; exit 1; }
            echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s /tmp/minisign.key -m "out/web-$BRAND.zip"
            node scripts/ci/web-ota-manifest.mjs manifest \
              --version "$VERSION" \
              --zip "out/web-$BRAND.zip" \
              --sig-file "out/web-$BRAND.zip.minisig" \
              --out "out/latest-$BRAND.json"
            cat "out/latest-$BRAND.json"
          done
          rm -f /tmp/minisign.key

      - name: Upload to S3 + publish manifests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          CHANNEL='${{ inputs.channel || 'stable' }}'
          NS='${{ inputs.namespace || '' }}'
          # The namespace nests INSIDE {brand}/web/, not above {brand}/. The
          # first shape tried was {ns}/{brand}/web/ and S3 refused it:
          #   AccessDenied ... user/k2app-ci-s3 is not authorized to perform
          #   s3:PutObject on "d0.all7.cc/uat/kaitu/web/..."
          # The CI IAM user is scoped to the known brand subtrees — a second,
          # independent guard on where a publish can land. Widening that policy
          # to make UAT convenient would spend a real safety property on a test
          # convenience, so the path bends to the policy instead.
          #
          # Result: {brand}/web/{ns}/web/{latest.json,{version}/web.zip}. The
          # doubled `web` is not a typo — the desktop override appends
          # `web/latest.json` to whatever base it is given (channel.rs
          # ota_sources_for), so the base handed to K2_WEB_OTA_BASE is
          # .../{brand}/web/{ns} and CI must place the tree one level under it.
          #
          # Collision with production is impossible by construction: production
          # is {brand}/web/ and every namespaced path carries a non-empty extra
          # segment. Nothing shipped polls {brand}/web/{ns}/... — clients poll
          # only {brand}/web/latest.json and {brand}/web/beta/latest.json.
          if [ -n "$NS" ]; then
            case "$NS" in
              *[!a-z0-9-]*|-*|beta|web)
                echo "::error::namespace must match [a-z0-9-]+, not start with '-', and not be 'beta' or 'web' (got '$NS')"
                exit 1 ;;
            esac
            PREFIX_SUFFIX="/${NS}/web"
            echo "::warning::UAT publish into namespace '$NS' — production paths are NOT touched"
          else
            PREFIX_SUFFIX=""
          fi
          echo "Publishing v$VERSION to channel: $CHANNEL (base: s3://d0.all7.cc/{brand}/web${PREFIX_SUFFIX})"
          for BRAND in kaitu overleap; do
            BASE="s3://d0.all7.cc/${BRAND}/web${PREFIX_SUFFIX}"
            aws s3 cp "out/web-$BRAND.zip" "$BASE/beta/${VERSION}/web.zip" --content-type application/zip
            aws s3 cp "out/latest-$BRAND.json" "$BASE/beta/latest.json" --content-type application/json
            if [ "$CHANNEL" = "stable" ]; then
              aws s3 cp "out/web-$BRAND.zip" "$BASE/${VERSION}/web.zip" --content-type application/zip
              aws s3 cp "out/latest-$BRAND.json" "$BASE/latest.json" --content-type application/json
            fi
          done

      - name: Invalidate CloudFront (both distributions)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # A namespaced publish lands under {brand}/web/{ns}/, which the
          # production wildcard /{brand}/web/* already covers — so the paths
          # below need no namespace handling at all.
          for DIST_ID in E3W144CRNT652P E34P52R7B93FSC; do
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/kaitu/web/*" "/overleap/web/*" \
              --no-cli-pager --output text > /dev/null
          done
          echo "CDN invalidated: d0.all7.cc + dl.kaitu.io (/{kaitu,overleap}/web/*)"

      # A failed linkage publish (spec §6 trigger 2, from release-desktop.yml /
      # build-mobile.yml) is otherwise silent except for a red run nobody is
      # watching — it leaves CDN latest behind the just-shipped app's embedded
      # UI, the exact inversion the linkage exists to prevent (终审 m5).
      - name: Notify Slack on publish failure
        if: failure()
        run: |
          ./scripts/ci/notify-slack.sh build-failure \
            --platform "Publish Web OTA" \
            --error "Web OTA publish failed (event: ${{ github.event_name }}, ref: ${{ github.ref_name }}). Check workflow run for details."
        env:
          SLACK_WEBHOOK_ALERT: ${{ secrets.SLACK_WEBHOOK_ALERT }}
