name: Build Mobile

on:
  push:
    # Listen to all v* tags; the `plan` job decides brands + platforms from the
    # suffix. No blacklist: a suffix owned by another workflow yields empty
    # brand lists and every job skips.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both
      brand:
        description: 'Brand to build'
        required: false
        default: 'kaitu'
        type: choice
        options:
          - kaitu
          - overleap
          - both
      dry_run:
        # Build + sign + brand-purity gate + attach IPA/APK to the run; skip
        # the App Store Connect upload, the S3 upload and the deploy Slack
        # message. Lets the release candidate be built at the real commit
        # without shipping it (same rationale as release-desktop.yml).
        description: 'Dry run — no App Store Connect / S3 upload, artifacts attached to the run only'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Production releases ship at info level. Debug logs leak token-bearing
  # URLs and engine internals into the app sandbox / device-log uploads.
  # For local debug builds, override via `make dev-android K2_BUILD_LOG_LEVEL=debug`.
  # Runtime SetLogLevel() still works regardless.
  K2_BUILD_LOG_LEVEL: info
  # Release builds must embed the full krs.tar.gz, never the cn-baseline
  # placeholder: fetch-rules-embed fails if the CDN archive is unreachable or
  # placeholder-sized. Mechanically enforces the deploy order (k2-rules live
  # first). See Makefile fetch-rules-embed.
  EMBED_REQUIRE_FULL: "1"

jobs:
  # Decide platforms + brands from the ref, mirroring release-desktop.yml's
  # suffix matrix. Bare v* = kaitu everything (+overleap when the repo variable
  # OVERLEAP_MOBILE_CI is "true"); -ios/-android = kaitu, one platform;
  # -overleap-ios / -overleap-android / -overleap-mobile = overleap only, so an
  # Overleap release never rebuilds or re-uploads kaitu. Any other suffix
  # belongs to another workflow → both lists empty → every job skips.
  # bash `case` takes the first match top-to-bottom and `-overleap-ios` is also
  # a valid `*-ios` suffix — the overleap patterns MUST stay above the kaitu ones.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios_brands: ${{ steps.plan.outputs.ios_brands }}
      android_brands: ${{ steps.plan.outputs.android_brands }}
    steps:
      - id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_BRAND: ${{ inputs.brand }}
          OVERLEAP_ON_BARE: ${{ vars.OVERLEAP_MOBILE_CI }}
        run: |
          set -euo pipefail
          KAITU='"kaitu"'; OVERLEAP='"overleap"'
          bare_brands="$KAITU"; [ "$OVERLEAP_ON_BARE" = "true" ] && bare_brands="$KAITU,$OVERLEAP"
          ios=""; android=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$IN_BRAND" in kaitu) b="$KAITU" ;; overleap) b="$OVERLEAP" ;; both) b="$KAITU,$OVERLEAP" ;; *) b="$KAITU" ;; esac
            case "$IN_PLATFORM" in ios) ios="$b" ;; android) android="$b" ;; both) ios="$b"; android="$b" ;; esac
          else
            case "$REF_NAME" in
              *-overleap-ios)     ios="$OVERLEAP" ;;
              *-overleap-android) android="$OVERLEAP" ;;
              *-overleap-mobile)  ios="$OVERLEAP"; android="$OVERLEAP" ;;
              *-ios)              ios="$KAITU" ;;
              *-android)          android="$KAITU" ;;
              *-*)                ;;
              *)                  ios="$bare_brands"; android="$bare_brands" ;;
            esac
          fi
          echo "ios_brands=[$ios]" >> "$GITHUB_OUTPUT"
          echo "android_brands=[$android]" >> "$GITHUB_OUTPUT"
          echo "ios=[$ios] android=[$android]"

  test-webapp:
    needs: plan
    if: needs.plan.outputs.ios_brands != '[]' || needs.plan.outputs.android_brands != '[]'
    uses: ./.github/workflows/test-webapp-reusable.yml
    # The reusable job inits the private k2 submodule (engine error-code gate).
    secrets: inherit

  build-ios:
    needs: [plan, test-webapp]
    if: needs.plan.outputs.ios_brands != '[]'
    # macos-26 (Tahoe) ships Xcode 26.x. Apple requires Xcode 26 + iOS 26 SDK
    # for App Store submissions from 2026-04-28. Pinning the runner (instead of
    # macos-latest) makes future Xcode upgrades explicit and reproducible.
    # GitHub-hosted (ephemeral) — no stale-workspace cleanup needed between
    # matrix legs or runs (each gets a fresh VM).
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Brand list comes from the `plan` job (tag suffix / dispatch input);
        # overleap-only tags never carry kaitu here.
        brand: ${{ fromJSON(needs.plan.outputs.ios_brands) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout k2 submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: k2/go.sum

      - name: Cache Go tools (gomobile)
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-gomobile-latest

      - name: Install gomobile
        run: |
          if ! command -v gomobile &>/dev/null; then
            go install golang.org/x/mobile/cmd/gomobile@latest
          fi
          gomobile init

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Resolve brand variables
        id: brand
        run: |
          BRAND="${{ matrix.brand }}"
          case "$BRAND" in
            kaitu) PRODUCT=Kaitu ;;
            overleap) PRODUCT=Overleap ;;
            *) echo "::error::unknown brand $BRAND"; exit 1 ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache gomobile bind output
        # Brand-neutral: k2mobile is protocol-layer, same for both brands, so
        # no matrix.brand in the key — this lets both legs share the cache.
        uses: actions/cache@v4
        with:
          path: k2/build
          key: gomobile-${{ runner.os }}-ios-${{ hashFiles('k2/**/*.go', 'k2/go.sum') }}

      - name: Setup CocoaPods cache
        uses: actions/cache@v4
        with:
          path: mobile/ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Import Apple code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_IOS }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_IOS_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "::error::Secret APP_STORE_CONNECT_API_KEY_BASE64 is not set"
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode \
            > ~/private_keys/AuthKey_"${APP_STORE_CONNECT_KEY_ID}".p8

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Strip only the suffixes this workflow owns (the `plan` job already
          # guarantees we only run on these). Overleap forms first: they end
          # in -ios / -android too.
          TAG_VERSION="${TAG_VERSION%-overleap-ios}"
          TAG_VERSION="${TAG_VERSION%-overleap-android}"
          TAG_VERSION="${TAG_VERSION%-overleap-mobile}"
          TAG_VERSION="${TAG_VERSION%-ios}"
          TAG_VERSION="${TAG_VERSION%-android}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Build iOS
        env:
          BRAND: ${{ matrix.brand }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Repo variable, normally unset (rev 0). Set to 1..9 ONLY to
          # re-upload an already-uploaded (version, slot) build — e.g. a
          # retagged release — then clear it. See build-mobile-ios.sh REV.
          IOS_BUILD_REV: ${{ vars.IOS_BUILD_REV || '0' }}
        run: bash scripts/build-mobile-ios.sh

      - name: Brand purity gate
        run: bash scripts/check-mobile-brand-purity.sh ${{ matrix.brand }} mobile/ios/App/build/App.xcarchive

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ matrix.brand }}
          path: mobile/ios/App/build/App.xcarchive
          retention-days: 30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ matrix.brand }}
          path: release/*/${{ steps.brand.outputs.product }}-*.ipa
          retention-days: 30

      # Both brands: same Apple team, same API key. ASC routes the upload to
      # the app record by the IPA's bundle id (io.overleap has its own record).
      - name: Upload to App Store Connect
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPA_PATH="release/${VERSION}/${{ steps.brand.outputs.product }}-${VERSION}.ipa"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # Web OTA is re-enabled: this workflow's `publish-web-ota` tail job (spec §6) auto-publishes
      # a web bundle from the same tag commit after both platform builds succeed, guarded by the
      # bridge-contract gate + white-screen smoke gate + CI-derived support floor. Compatibility
      # with apps older than the floor is handled by runtime capability detection, not a version
      # gate — see webapp/CLAUDE.md 兼容模型 section. (2026-03-22 storage regression incident is
      # resolved by that floor/detection design, not by disabling OTA.)

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Notify Slack on iOS success
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ matrix.brand }}" = "kaitu" ]; then
            DOWNLOAD_URL="<https://apps.apple.com/app/id6448744655|App Store>"
          else
            DOWNLOAD_URL="TestFlight (Overleap VPN, io.overleap)"
          fi
          ./scripts/ci/notify-slack.sh deploy-success \
            --version "${VERSION}" \
            --platforms "iOS (${{ matrix.brand }})" \
            --download-url "${DOWNLOAD_URL}"
        env:
          SLACK_WEBHOOK_RELEASE: ${{ secrets.SLACK_WEBHOOK_RELEASE }}

      - name: Notify Slack on iOS failure
        # dry-run 演练不发失败告警（避免误报）；真实 tag 发版仍照常告警。
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          ./scripts/ci/notify-slack.sh build-failure \
            --platform "iOS (${{ matrix.brand }})" \
            --error "Mobile iOS build failed. Check workflow run for details."
        env:
          SLACK_WEBHOOK_ALERT: ${{ secrets.SLACK_WEBHOOK_ALERT }}

  build-android:
    needs: [plan, test-webapp]
    if: needs.plan.outputs.android_brands != '[]'
    # GitHub-hosted (ephemeral) — no stale-workspace cleanup needed between
    # matrix legs or runs (each gets a fresh VM).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Brand list comes from the `plan` job (tag suffix / dispatch input);
        # overleap-only tags never carry kaitu here.
        brand: ${{ fromJSON(needs.plan.outputs.android_brands) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout k2 submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: k2/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.1.10909125
          key: android-ndk-26.1.10909125

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Cache Go tools (gomobile)
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-gomobile-latest

      - name: Install gomobile
        run: |
          if ! command -v gomobile &>/dev/null; then
            go install golang.org/x/mobile/cmd/gomobile@latest
          fi
          gomobile init
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Resolve brand variables
        id: brand
        run: |
          BRAND="${{ matrix.brand }}"
          case "$BRAND" in
            kaitu) PRODUCT=Kaitu ;;
            overleap) PRODUCT=Overleap ;;
            *) echo "::error::unknown brand $BRAND"; exit 1 ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache gomobile bind output
        # Brand-neutral: k2mobile is protocol-layer, same for both brands, so
        # no matrix.brand in the key — this lets both legs share the cache.
        uses: actions/cache@v4
        with:
          path: k2/build
          key: gomobile-${{ runner.os }}-android-${{ hashFiles('k2/**/*.go', 'k2/go.sum') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Strip only the suffixes this workflow owns (the `plan` job already
          # guarantees we only run on these). Overleap forms first: they end
          # in -ios / -android too.
          TAG_VERSION="${TAG_VERSION%-overleap-ios}"
          TAG_VERSION="${TAG_VERSION%-overleap-android}"
          TAG_VERSION="${TAG_VERSION%-overleap-mobile}"
          TAG_VERSION="${TAG_VERSION%-ios}"
          TAG_VERSION="${TAG_VERSION%-android}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Decrypt Android keystore
        env:
          KAITU_ANDROID_STORE_PASSWORD: ${{ secrets.KAITU_ANDROID_STORE_PASSWORD }}
          OVERLEAP_ANDROID_STORE_PASSWORD: ${{ secrets.OVERLEAP_ANDROID_STORE_PASSWORD }}
        run: |
          BRAND="${{ matrix.brand }}"
          if [ "$BRAND" = "overleap" ]; then
            STORE_PASSWORD="$OVERLEAP_ANDROID_STORE_PASSWORD"
          else
            STORE_PASSWORD="$KAITU_ANDROID_STORE_PASSWORD"
          fi
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
            -in "mobile/android/app/${BRAND}-release.jks.enc" \
            -out "mobile/android/app/${BRAND}-release.jks" \
            -pass pass:"$STORE_PASSWORD"

      - name: Build Android
        run: bash scripts/build-mobile-android.sh
        env:
          BRAND: ${{ matrix.brand }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KAITU_ANDROID_STORE_PASSWORD: ${{ secrets.KAITU_ANDROID_STORE_PASSWORD }}
          OVERLEAP_ANDROID_STORE_PASSWORD: ${{ secrets.OVERLEAP_ANDROID_STORE_PASSWORD }}
          # Repo variable, normally unset (rev 0). Set to 1..99 ONLY to
          # re-upload an already-uploaded version to Google Play (which burns
          # every accepted versionCode), then clear it. See sync-version.sh.
          ANDROID_BUILD_REV: ${{ vars.ANDROID_BUILD_REV || '0' }}

      - name: Brand purity gate
        # Brand-exact path (not a release/*/*.apk glob): the runner is
        # ephemeral (GitHub-hosted) so there's no stale cross-brand artifact
        # risk here, but the exact path also doubles as a build-output sanity
        # check — if build-mobile-android.sh didn't produce this file, fail
        # loudly instead of the gate silently matching nothing.
        run: |
          APK="release/${{ steps.brand.outputs.version }}/${{ steps.brand.outputs.product }}-${{ steps.brand.outputs.version }}.apk"
          bash scripts/check-mobile-brand-purity.sh ${{ matrix.brand }} "$APK"

      - name: Brand purity gate (AAB)
        run: |
          AAB="release/${{ steps.brand.outputs.version }}/${{ steps.brand.outputs.product }}-${{ steps.brand.outputs.version }}.aab"
          bash scripts/check-mobile-brand-purity.sh ${{ matrix.brand }} "$AAB"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.brand }}
          path: release/*/${{ steps.brand.outputs.product }}-*.apk
          retention-days: 30

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ matrix.brand }}
          path: release/*/${{ steps.brand.outputs.product }}-*.aab
          if-no-files-found: error
          retention-days: 30

      # overleap android is Play-only (see scripts/publish-mobile.sh): the AAB
      # is uploaded to the Play Console by hand from the artifact above; no
      # CDN APK, no android manifest.
      - name: Upload Android APK to S3
        if: matrix.brand == 'kaitu' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          BRAND: ${{ matrix.brand }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-1
        run: bash scripts/ci/upload-release.sh --android

      - name: Notify Slack on Android success
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ matrix.brand }}" = "kaitu" ]; then
            CDN_BASE="https://dl.kaitu.io/${{ matrix.brand }}/android"
            DOWNLOAD_URL="<${CDN_BASE}/${VERSION}/${{ steps.brand.outputs.product }}-${VERSION}.apk|Android APK>"
          else
            DOWNLOAD_URL="AAB attached to the workflow run (Play-only brand)"
          fi
          ./scripts/ci/notify-slack.sh deploy-success \
            --version "${VERSION}" \
            --platforms "Android (${{ matrix.brand }})" \
            --download-url "${DOWNLOAD_URL}"
        env:
          SLACK_WEBHOOK_RELEASE: ${{ secrets.SLACK_WEBHOOK_RELEASE }}

      - name: Notify Slack on Android failure
        # dry-run 演练不发失败告警（避免误报）；真实 tag 发版仍照常告警。
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          ./scripts/ci/notify-slack.sh build-failure \
            --platform "Android (${{ matrix.brand }})" \
            --error "Mobile Android build failed. Check workflow run for details."
        env:
          SLACK_WEBHOOK_ALERT: ${{ secrets.SLACK_WEBHOOK_ALERT }}

  # App 发版联动（web OTA spec §6 触发 2）：任一移动平台构建成功且无失败时，
  # 从同一 tag commit 发布双品牌 web bundle。平台后缀 tag（-ios/-android）会
  # skip 另一个 build job，所以不能用裸 needs 成功语义 — 显式检查 result：
  # 至少一个 success、零 failure 才联动。恒 stable 通道。只在 push 的真实 v*
  # tag 时联动；dispatch 重建旧 tag 绝不发布——时间基构建号下那会把旧 UI 变成
  # 全网最新（终审 B1）。预发布（-beta）app 发版不联动：web OTA 版本恒
  # x.y.z.n，beta web 走 publish-web-ota 的 dispatch channel=beta（终审 m4）。
  #
  # ⚠️ 可发现性：本 workflow 的 trigger 是 `tags: ['v*']`，**任何** v* tag（含
  # -ios / -android / -overleap-* 单平台后缀）只要有一个平台构建成功，就会走到
  # 这里发双品牌 stable web OTA。release-desktop.yml 的同名 job 另有
  # `needs.plan.outputs.should_run` 把未知后缀挡掉 —— 两个 workflow 的门**不
  # 对称**，只读其中一个会得出「这个 tag 不发 OTA」的错误结论（2026-09-07 就是
  # 这么误判的，v0.4.10-overleap-mobile 实际发了 0.4.10.21546118）。
  #
  # `linkage: true` 让被调 workflow 知道这是 app 发版搭车：若该 tag commit 的
  # webapp 比线上更旧，它会跳过而不是把 app 发版搞红（判据见
  # scripts/ci/web-ota-gate.mjs）。
  publish-web-ota:
    needs: [build-ios, build-android]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-beta') &&
      (needs.build-ios.result == 'success' || needs.build-android.result == 'success') &&
      needs.build-ios.result != 'failure' && needs.build-android.result != 'failure'
    uses: ./.github/workflows/publish-web-ota.yml
    with:
      linkage: true
    secrets: inherit
