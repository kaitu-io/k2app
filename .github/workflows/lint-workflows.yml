name: Lint Workflows

# Guards a failure mode that hides itself: a workflow-validation error (bad
# context, malformed expression, unknown key) is rejected by GitHub *before*
# scheduling, so the run completes with ZERO jobs. Nothing is tested, yet the
# commit shows only "a failed check" — indistinguishable at a glance from one
# failing test. ci.yml sat in exactly that state from 2026-08-16 to 2026-08-18
# (a `runner` context in a job-level `env:`), so every push in that window went
# entirely unverified while looking merely red.
#
# This lives in its OWN file on purpose: a lint job inside ci.yml could not
# catch ci.yml being invalid, because it would not run either.

on:
  push:
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned image, no network fetch of a script. Shellcheck findings in
      # `run:` blocks are pre-existing and not what this gate is for, so only
      # workflow-structure problems fail the build.
      #
      # The regex is deliberately space-free: `args` reaches the container as
      # one string that Docker word-splits, so shell quoting is NOT honoured —
      # `-ignore 'shellcheck reported issue'` splits into four tokens and the
      # next flag gets read as a filename ("could not read \"-color\"").
      # `.+` stands in for the spaces so the whole pattern survives as one token.
      #
      # Pin 1.7.12, not an older tag: actionlint carries a baked-in list of
      # GitHub-hosted runner labels, and 1.7.7 predates `macos-26` (which
      # build-mobile.yml needs for Xcode 26 / the iOS 26 SDK). On 1.7.7 that
      # valid label reads as `label "macos-26" is unknown`. Bumping the image
      # is the fix rather than suppressing the runner-label rule, which would
      # also stop catching genuine label typos. Keep this in step with whatever
      # actionlint a developer runs locally — verifying against a different
      # version than CI runs is the same as not verifying.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -ignore shellcheck.+reported -color
