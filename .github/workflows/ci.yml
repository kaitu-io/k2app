name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-webapp:
    uses: ./.github/workflows/test-webapp-reusable.yml

  # web/ had NO CI coverage until now, which meant its brand-leak guards
  # (tests/brand-guard.test.ts, tests/brand-leak-ssr.test.tsx) and the
  # cross-layer contract test were documentation, not gates — they only ran
  # when someone remembered to run them locally.
  # One run covers both brands: web resolves NEXT_PUBLIC_BRAND at call time via
  # siteBrand(), so the tests flip it with vi.stubEnv rather than being baked
  # like webapp's __K2_BRAND__ define.
  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # web/.nvmrc + engines.node >=22
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      # web/ is NOT part of the root yarn workspace — it has its own lockfile.
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: web

      # .velite/ is a gitignored build artifact, so it is absent on a fresh
      # checkout; without it every test importing #velite fails to resolve.
      - name: Generate Velite content
        run: npx velite build
        working-directory: web

      - name: Run web tests (vitest)
        run: yarn test
        working-directory: web

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $PKG_VERSION"

          # Every file below is rewritten from package.json by
          # scripts/sync-version.sh, which `make pre-build` runs on every build
          # path — so committed drift should be impossible. That is precisely
          # why this gate exists: it is the canary for sync-version.sh ITSELF
          # breaking. Each substitution is a sed pattern matched against a
          # hand-edited file; reformat that file and the pattern stops matching,
          # silently, and the version simply stops propagating. Nothing else in
          # the build would notice or fail.
          #
          # k2AppVersion is load-bearing beyond bookkeeping: it is the native
          # version the web-OTA min_native gate compares manifests against.
          # A stale value there does not break a build — it makes the shell lie
          # about which webapp bundles it can run.
          fail=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$PKG_VERSION" ]; then
              echo "::error::Version mismatch: package.json ($PKG_VERSION) != $1 ($2) — run scripts/sync-version.sh; if that does not fix it, its sed pattern for that file no longer matches"
              fail=1
            fi
          }

          check "Cargo.toml" \
            "$(grep '^version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          check "android build.gradle versionName" \
            "$(sed -n 's/.*versionName "\(.*\)".*/\1/p' mobile/android/app/build.gradle | head -1)"
          check "iOS k2AppVersion" \
            "$(sed -n 's/^let k2AppVersion = "\(.*\)".*/\1/p' mobile/plugins/k2-plugin/ios/Plugin/K2Helpers.swift)"

          [ "$fail" -eq 0 ] || exit 1
          echo "All versions consistent: $PKG_VERSION"

      # The iOS CFBundleVersion is derived, not stored, so the check above
      # cannot see it. Its rules are load-bearing in a way that only shows up
      # at upload time: App Store Connect permanently burns every accepted
      # number, so a scheme that cannot produce a fresh one blocks the release
      # outright (0.4.8 hit exactly that — see build-mobile-ios.sh).
      - name: Check iOS build-number rules
        run: bash scripts/test-ios-build-number.sh

  # --- Platform-dependent tests (Linux — Rust storage crypto platform gate) ---
  test-linux-rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Create sidecar placeholder
        run: |
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/k2-${TRIPLE}"

      - name: Install webkit2gtk build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cargo test (Tauri — Linux platform gate)
        run: cargo test -- --nocapture 2>&1 | tee /tmp/rust-test-output.txt
        working-directory: desktop/src-tauri

      - name: Go test MCP
        run: go test ./... -v -count=1 2>&1 | tee /tmp/go-test-output.txt
        working-directory: mcp

      - name: Cross-language hardware ID gate
        run: |
          RUST_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/rust-test-output.txt | head -1 | cut -d= -f2)
          GO_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/go-test-output.txt | head -1 | cut -d= -f2)
          echo "Rust hardware ID: $RUST_HWID"
          echo "Go   hardware ID: $GO_HWID"
          if [ -z "$RUST_HWID" ] || [ -z "$GO_HWID" ]; then
            echo "::error::Hardware ID not found in test output"
            exit 1
          fi
          if [ "$RUST_HWID" != "$GO_HWID" ]; then
            echo "::error::Hardware ID mismatch! Rust ($RUST_HWID) != Go ($GO_HWID)"
            exit 1
          fi
          echo "Cross-language hardware ID gate PASSED"

  # --- Platform-dependent tests (macOS) ---
  test-macos:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: k2/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Verify sccache works
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache rustc -vV >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache GHA backend unavailable, compiling without cache"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Create sidecar placeholder for cargo check
        run: |
          TRIPLE=$(RUSTC_WRAPPER= rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/k2-${TRIPLE}"

      - name: Cargo check (Tauri)
        run: cargo check
        working-directory: desktop/src-tauri

      - name: Cargo test (Tauri)
        run: cargo test -- --nocapture 2>&1 | tee /tmp/rust-test-output.txt
        working-directory: desktop/src-tauri

      - name: Go test MCP
        run: go test ./... -v -count=1 2>&1 | tee /tmp/go-test-output.txt
        working-directory: mcp

      - name: Cross-language hardware ID gate
        run: |
          RUST_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/rust-test-output.txt | head -1 | cut -d= -f2)
          GO_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/go-test-output.txt | head -1 | cut -d= -f2)
          echo "Rust hardware ID: $RUST_HWID"
          echo "Go   hardware ID: $GO_HWID"
          if [ -z "$RUST_HWID" ] || [ -z "$GO_HWID" ]; then
            echo "::error::Hardware ID not found in test output"
            exit 1
          fi
          if [ "$RUST_HWID" != "$GO_HWID" ]; then
            echo "::error::Hardware ID mismatch! Rust ($RUST_HWID) != Go ($GO_HWID)"
            echo "::error::This means encrypted storage written by Tauri cannot be read by MCP"
            exit 1
          fi
          echo "Cross-language hardware ID gate PASSED"

      - name: Go test k2 core (deadlock detection enabled)
        run: go test ./... -count=1 -short -timeout=120s
        working-directory: k2

      - name: Go build k2 (deadlock_disable — production mode)
        run: go build -tags=deadlock_disable ./...
        working-directory: k2

      # -count=1 is load-bearing, not cargo-cult: TestExportContract compares the
      # committed contracts/api-contract.json against live Go values, and that file
      # lives OUTSIDE the api/ module. cmd/go does not stat files outside the module
      # when deciding cache validity, so hand-editing the contract to match drifted
      # code returns `ok (cached)` — the exact move this gate exists to stop. The
      # k2 steps above already carry -count=1 for the same class of reason.
      - name: Go test API (mock-only)
        run: go test ./... -count=1
        working-directory: api

  # --- Gateway (k2r) soft-router UAT — no hardware, runs in CI (Tier 3a) ---
  # The k2/test/k2r-uat Docker harness (lan-client → k2r TPROXY → k2s) exercises
  # the full router data path with no physical router. A real Linux runner has the
  # TPROXY kernel modules Docker Desktop lacks, so K2R_UAT_REQUIRE_DATAPLANE=1
  # turns a missing data plane into a hard failure instead of a silent skip.
  # Also runs the gateway unit tests, which are //go:build linux and therefore
  # run on NO other job (test-macos is darwin → they compile out).
  test-gateway-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init --recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: k2/go.sum

      - name: Load TPROXY kernel modules
        run: |
          sudo modprobe nf_tables || true
          sudo modprobe nft_tproxy || true
          sudo modprobe xt_TPROXY || true
          sudo modprobe iptable_mangle || true
          sudo modprobe ip6table_mangle || true
          echo "Loaded netfilter/tproxy modules:"
          lsmod | grep -iE 'tproxy|nf_tables|mangle' || echo "(none visible — may be builtin)"

      # The only place k2's //go:build linux code is compiled and tested.
      # test-macos runs `go test ./...` for k2, but a linux-tagged package
      # is excluded from that compile outright — it reports no failures
      # because nothing in it is ever built, not because it passed. So a
      # linux-only package is invisible unless it is named here.
      #
      # Adding a new linux-only package (or linux-only file in an existing
      # package) means adding it to this list. daemon/ is on it for its
      # linux-only files — webui_linux.go and the web OTA wiring — whose
      # non-linux counterpart on the macOS job is the webui_nop.go stub.
      - name: Linux-only package tests (gateway, webui, daemon — no other job builds these)
        run: go test ./gateway/... ./webui/... ./daemon/... -count=1
        working-directory: k2

      - name: Gateway soft-router UAT (data plane required)
        run: K2R_UAT_REQUIRE_DATAPLANE=1 make gateway-uat
        working-directory: k2

  # --- Platform-dependent tests (Windows) ---
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        shell: bash
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install yarn
        shell: bash
        run: npm install -g yarn

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: k2/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Verify sccache works
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          if sccache rustc -vV >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache GHA backend unavailable, compiling without cache"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install Node dependencies
        shell: bash
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Create sidecar placeholder for cargo check
        shell: bash
        run: |
          TRIPLE=$(RUSTC_WRAPPER= rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/k2-${TRIPLE}.exe"

      - name: Cargo check (Tauri)
        shell: bash
        run: cargo check
        working-directory: desktop/src-tauri

      - name: MachineGuid baseline (pre-Rust)
        if: runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          echo === reg query (cmd, pre-Rust, native view) ===
          reg query "HKLM\SOFTWARE\Microsoft\Cryptography" /v MachineGuid
          echo === reg query KEY_WOW64_64KEY view ===
          reg query "HKLM\SOFTWARE\Microsoft\Cryptography" /v MachineGuid /reg:64
          echo === reg query KEY_WOW64_32KEY view ===
          reg query "HKLM\SOFTWARE\Microsoft\Cryptography" /v MachineGuid /reg:32
          echo === wmic csproduct UUID ===
          wmic csproduct get UUID

      - name: Cargo test (Tauri)
        shell: bash
        run: cargo test -- --nocapture 2>&1 | tee /tmp/rust-test-output.txt
        working-directory: desktop/src-tauri

      - name: MachineGuid mid-check (post-Rust, pre-Go)
        if: runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          echo === reg query (cmd, post-Rust pre-Go) ===
          reg query "HKLM\SOFTWARE\Microsoft\Cryptography" /v MachineGuid

      - name: Go test MCP
        shell: bash
        run: go test ./... -v -count=1 2>&1 | tee /tmp/go-test-output.txt
        working-directory: mcp

      - name: MachineGuid post-Go check
        if: runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          echo === reg query (cmd, post-Go) ===
          reg query "HKLM\SOFTWARE\Microsoft\Cryptography" /v MachineGuid

      - name: Cross-language hardware ID gate
        shell: bash
        run: |
          RUST_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/rust-test-output.txt | head -1 | cut -d= -f2)
          GO_HWID=$(grep 'CROSS_LANG_GATE_HWID=' /tmp/go-test-output.txt | head -1 | cut -d= -f2)
          echo "Rust hardware ID: $RUST_HWID"
          echo "Go   hardware ID: $GO_HWID"
          if [ -z "$RUST_HWID" ] || [ -z "$GO_HWID" ]; then
            echo "::error::Hardware ID not found in test output"
            exit 1
          fi
          if [ "$RUST_HWID" != "$GO_HWID" ]; then
            echo "::error::Hardware ID mismatch! Rust ($RUST_HWID) != Go ($GO_HWID)"
            echo "::error::This means encrypted storage written by Tauri cannot be read by MCP"
            echo "::error::Inspect 'MachineGuid baseline / mid-check / post-Go' steps for ground truth from reg.exe"
            exit 1
          fi
          echo "Cross-language hardware ID gate PASSED"

      - name: Go test (k2, deadlock detection enabled)
        shell: bash
        run: go test ./sniff/... ./core/... ./engine/... ./config/... ./daemon/ ./provider/... -count=1 -short -timeout=120s
        working-directory: k2

      # Windows process attribution is the one thing only a real Windows
      # kernel can prove. Every other provider test injects mock iphlpapi
      # fetchers — which is exactly why the R1 bug (IPv6 lookups
      # short-circuited to "") shipped with a fully green suite.
      #
      # The step above runs these tests too, but with -short and without -v:
      # a test that quietly stopped running (build-tag drift, someone adding
      # a testing.Short() guard, a runner without IPv6) would be
      # indistinguishable from a pass. So run them alone, verbosely, and
      # assert each one actually reported PASS. A zero exit code is not
      # evidence that a test executed.
      - name: Real-kernel IPv6 attribution gate (must actually run)
        shell: bash
        run: |
          set -o pipefail
          go test ./provider/ -run 'TestWindowsFindProcess_RealKernelTable' \
            -count=1 -v -timeout=120s 2>&1 | tee /tmp/realkernel.txt
          for tc in IPv6TCP IPv6UDP; do
            if ! grep -q -- "--- PASS: TestWindowsFindProcess_RealKernelTable_${tc}" /tmp/realkernel.txt; then
              echo "::error::TestWindowsFindProcess_RealKernelTable_${tc} did not report PASS."
              echo "::error::A green exit code without that line means the test never ran —"
              echo "::error::check for a build-tag change, a testing.Short() guard, or a runner without IPv6."
              exit 1
            fi
          done
          echo "Real-kernel IPv6 attribution gate PASSED (both cases executed on a live kernel table)"
        working-directory: k2

      # A green gate only means something if the gate can go red. This step
      # proves it, and proves the gate is not redundant, by breaking exactly
      # the layer nothing else in the package touches: the AF_INET6 constant
      # handed to GetExtendedTcpTable/GetExtendedUdpTable by the real v6
      # fetchers. The mocks never call them; the literal-offset layout tests
      # never call them; the compile-time size guards cannot see a constant.
      #
      # Contract asserted here, and stated in process_windows_realkernel_test.go:
      #   under this mutation, the real-kernel gate is RED and every other
      #   test in the package is GREEN.
      # If the second half ever stops holding, the gate stopped being the
      # only thing covering this layer — update that comment, do not silence
      # this step.
      - name: Real-kernel gate self-check (mutation must kill it)
        shell: bash
        run: |
          set -uo pipefail
          trap 'git checkout -- provider/process_windows.go 2>/dev/null || true' EXIT

          if ! git diff --quiet -- provider/process_windows.go; then
            echo "::error::provider/process_windows.go is already modified; refusing to mutate a dirty file."
            exit 1
          fi

          sed -i -E 's/(fetchOwnerTable\[(tcp6|udp6)RowOwnerPID\]\(proc[A-Za-z]+, )AF_INET6/\1AF_INET/' \
            provider/process_windows.go
          CHANGED=$(git diff --numstat -- provider/process_windows.go | awk '{print $1"/"$2}')
          if [ "$CHANGED" != "2/2" ]; then
            echo "::error::mutation did not apply as expected (changed=${CHANGED:-none}, want 2/2)."
            echo "::error::realTCP6Fetcher/realUDP6Fetcher were probably refactored — update this step's"
            echo "::error::sed so it still breaks the AF_INET6 wiring, rather than deleting the check."
            exit 1
          fi

          # The mutation must be a semantic bug, not a build break: a package
          # that fails to compile would fail the gate for the wrong reason.
          if ! go build ./provider/; then
            echo "::error::mutated package does not compile — the mutation is invalid, not the code."
            exit 1
          fi

          if go test ./provider/ -run 'TestWindowsFindProcess_RealKernelTable' -count=1 -timeout=120s \
               > /tmp/mut-gate.txt 2>&1; then
            echo "::error::The real-kernel gate PASSED while the v6 fetchers query the AF_INET table."
            echo "::error::It is not actually reaching the kernel path it claims to cover."
            cat /tmp/mut-gate.txt
            exit 1
          fi
          echo "OK: mutation kills the real-kernel gate"

          if ! go test ./provider/ -count=1 -skip 'RealKernelTable' -timeout=300s \
               > /tmp/mut-rest.txt 2>&1; then
            echo "::error::The AF_INET6 mutation was ALSO caught outside the real-kernel gate."
            echo "::error::That contradicts the rationale in process_windows_realkernel_test.go."
            echo "::error::Find which test now covers the syscall layer and update that comment."
            cat /tmp/mut-rest.txt
            exit 1
          fi
          echo "OK: every other test in the package stays green under the mutation"

          git checkout -- provider/process_windows.go
          git diff --quiet -- provider/process_windows.go || {
            echo "::error::failed to restore provider/process_windows.go"; exit 1; }
          echo "Gate self-check PASSED (gate is both live and the only cover for the AF_INET6 syscall path)"
        working-directory: k2

      - name: Build k2 Windows binary
        shell: bash
        run: make build-k2-windows

      - name: Verify k2 binary exists
        shell: bash
        run: test -f desktop/src-tauri/binaries/k2-x86_64-pc-windows-msvc.exe

      # #3297 ("service does not come back after an upgrade") still has no
      # confirmed root cause, and the observability work meant to answer it
      # has never once run against a real Windows SCM — only against unit
      # tests that assert on the *strings* the code would emit.
      #
      # The GitHub runner is already elevated, so `k2 service install` (the
      # exact command the desktop shell elevates into via -Verb RunAs) runs
      # here directly, no UAC involved. That exercises SCM create, the legacy
      # cleanup, the recovery-action config, the real service start, and the
      # diagnostic log — the whole surface #3297 lives on.
      - name: Windows service install gate (real SCM)
        shell: bash
        run: |
          set -uo pipefail
          K2="$PWD/desktop/src-tauri/binaries/k2-x86_64-pc-windows-msvc.exe"

          # DefaultLogPath branches on IsRoot(), so the log lands in
          # ProgramData when elevated and in the user log dir otherwise.
          # Don't assume which: find it, and report where — if it turns up in
          # the user dir, the runner is not elevated and this gate is testing
          # something weaker than it claims.
          find_install_log() {
            find "$(cygpath -u "${PROGRAMDATA:-C:/ProgramData}")/kaitu" \
                 "$(cygpath -u "${LOCALAPPDATA:-C:/Users/runneradmin/AppData/Local}")" \
                 -name k2-service-install.log 2>/dev/null | head -1
          }

          dump_diag() {
            echo "--- sc query kaitu ---"; sc.exe query kaitu 2>&1 || true
            local l; l=$(find_install_log)
            echo "--- install log (${l:-NOT FOUND}) ---"
            [ -n "$l" ] && cat "$l" || true
          }

          echo "::group::first install"
          if ! "$K2" service install; then
            echo "::error::k2 service install failed"; dump_diag; exit 1
          fi
          echo "::endgroup::"

          if ! sc.exe query kaitu >/dev/null 2>&1; then
            echo "::error::service 'kaitu' is not registered after a successful install"
            dump_diag; exit 1
          fi

          LOG=$(find_install_log)
          if [ -z "$LOG" ]; then
            echo "::error::k2-service-install.log was never written — the diagnostic"
            echo "::error::trail #3297 depends on does not exist in practice."
            dump_diag; exit 1
          fi
          echo "install log found at: $LOG"
          grep -q "elevated=" "$LOG" || { echo "::error::log missing the elevated= marker"; dump_diag; exit 1; }
          grep -q "service started OK" "$LOG" || { echo "::error::service never reported a successful start"; dump_diag; exit 1; }

          # Every upgrade re-runs this path, so a second install must clean up
          # and recreate rather than fail on the existing service. That is the
          # exact step #3297 reports as broken in the field.
          echo "::group::second install (idempotency)"
          if ! "$K2" service install; then
            echo "::error::re-install over an existing service failed — this is the #3297 shape"
            dump_diag; exit 1
          fi
          echo "::endgroup::"
          grep -q 'cleanup existing "kaitu"' "$LOG" || { echo "::error::re-install did not log the existing-service cleanup"; dump_diag; exit 1; }

          "$K2" service uninstall || { echo "::error::uninstall failed"; dump_diag; exit 1; }
          if sc.exe query kaitu >/dev/null 2>&1; then
            echo "::error::service survived uninstall"; dump_diag; exit 1
          fi

          echo "Windows service install gate PASSED (install → start → re-install → uninstall on a real SCM)"

  # --- Windows build verification (main only) ---
  build-windows:
    runs-on: [self-hosted, Windows]
    needs: test-windows
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Journal every signCommand invocation (desktop/src-tauri/windows-sign.sh
      # writes here when the var is set). Tauri swallows that command's output
      # and reports only "failed to bundle project 'failed to run bash'", which
      # does not say whether the signer ran and failed or never started — the
      # journal's ENTER lines do. Scoped to run+attempt because this is a
      # self-hosted runner: a fixed path would show a previous run's journal and
      # read as though the current one produced it.
      #
      # Set here rather than in a job-level `env:` because the `runner` context
      # does not exist at job level — referencing it there is not a runtime
      # error but a workflow-validation error, so GitHub rejects the whole file
      # before scheduling anything (run completes with zero jobs). $RUNNER_TEMP
      # is the step-level equivalent and is always defined in a step shell.
      - name: Configure signCommand journal path
        shell: bash
        run: |
          echo "K2_SIGN_LOG=$RUNNER_TEMP/k2-sign-${{ github.run_id }}-${{ github.run_attempt }}.log" >> "$GITHUB_ENV"

      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.K2_DEPLOY_KEY }}
            ${{ secrets.KUIC_DEPLOY_KEY }}

      - name: Init k2 submodule
        shell: bash
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init --recursive

      - name: Setup Node.js (self-hosted)
        # The runner's .path file already pins a working node onto PATH
        # (no shell rc is sourced for a launchd service process, so the
        # `nvm` shell function this step used to invoke is never defined —
        # "nvm: 未找到命令", exit 127, every run). Verify the pinned
        # version satisfies .nvmrc instead of trying to switch versions.
        shell: bash
        run: |
          NODE_VERSION=$(cat .nvmrc)
          CURRENT=$(node -v 2>/dev/null || echo "none")
          if [[ "$CURRENT" != v${NODE_VERSION}.* ]]; then
            echo "::error::Runner node ($CURRENT) does not satisfy .nvmrc (v${NODE_VERSION}.x) — update the runner's .path entry"
            exit 1
          fi
          echo "Using node $CURRENT"
          if ! command -v yarn &>/dev/null; then
            npm install -g yarn
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set persistent cache paths (self-hosted)
        # This job cross-compiles the Windows target FROM the macOS
        # self-hosted runner (see build-windows's runs-on comment history —
        # there is no actual Windows machine here, "Windows" is a custom
        # label on macOS-runner-k2app). C:/... paths are a Windows
        # filesystem convention and are not absolute on Darwin, so Go
        # rejected GOMODCACHE outright ("entry is relative; must be
        # absolute path") the first time this step ever actually ran.
        shell: bash
        run: |
          echo "CARGO_HOME=$HOME/cache/cargo" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$HOME/cache/gomod" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "$HOME/cache/cargo/bin" >> "$GITHUB_PATH"

      - name: Setup sccache (Windows local disk)
        shell: bash
        run: |
          if ! command -v sccache &>/dev/null; then
            RUSTC_WRAPPER= cargo install sccache --locked
          fi

      - name: Install Node dependencies
        shell: bash
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: make build-windows

      # Runs on success too: a green build's journal is the baseline that makes
      # a failed one readable (how many files get signed, in what order, what
      # the resource counters look like when nothing is wrong).
      - name: signCommand journal
        if: always()
        shell: bash
        run: |
          if [ ! -f "$K2_SIGN_LOG" ]; then
            echo "No journal at $K2_SIGN_LOG — the signCommand wrapper never ran."
            echo "If the build failed at a signing step, the failure is upstream"
            echo "of desktop/src-tauri/windows-sign.sh (process never spawned)."
            exit 0
          fi
          echo "=== signCommand journal ==="
          cat "$K2_SIGN_LOG"
          echo "=== summary ==="
          echo "invocations entered : $(grep -c '^=== ENTER' "$K2_SIGN_LOG" || true)"
          echo "invocations exited  : $(grep -c '^=== EXIT' "$K2_SIGN_LOG" || true)"
          echo "non-zero exits      : $(grep -c '^=== EXIT rc=[^0]' "$K2_SIGN_LOG" || true)"

      - name: Verify NSIS installer exists
        shell: bash
        run: ls -la desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      # Hand the signed installer to smoke-windows. This job cross-compiles on
      # a macOS runner and can never execute what it produces.
      - name: Upload NSIS installer for the smoke gate
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Verify k2 binary exists
        shell: bash
        run: test -f desktop/src-tauri/binaries/k2-x86_64-pc-windows-msvc.exe

      - name: Verify version alignment
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$CARGO_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Version mismatch! Cargo.toml ($CARGO_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Versions match."

  # The Windows smoke that release checklists have been asking a human to do
  # since at least 2026-07 — and that consequently never happened, holding up
  # three fixed user-facing bugs. Nothing here needs eyes: it installs the real
  # signed installer on a real Windows kernel and asserts what a person would
  # have looked for.
  #
  # It covers a path the k2-binary service gate cannot: POSTINSTALL runs
  # `k2 service install` through NSIS's nsExec, in the installer's context.
  # That is where #3297 actually lives; invoking the same binary from a shell
  # (as test-windows does) exercises different plumbing.
  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22 for the global WebSocket the CDP probe speaks.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      - name: Silent install
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          Write-Host "installer: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "silent install failed with $($p.ExitCode)" }

      - name: Installer did what it claims
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Kaitu"
          foreach ($f in @("$dir\Kaitu.exe", "$dir\k2.exe", "$dir\install-diag.log")) {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          Write-Host "--- install-diag.log ---"
          Get-Content "$dir\install-diag.log"

          # POSTINSTALL installs the service through nsExec. A non-zero exit
          # here is the #3297 shape as users actually meet it.
          $diag = Get-Content "$dir\install-diag.log" -Raw
          if ($diag -notmatch 'service_install_exit=0') {
            throw "NSIS POSTINSTALL service install did not report exit 0 — this is #3297"
          }

          $svc = Get-Service -Name kaitu -ErrorAction SilentlyContinue
          if (-not $svc) { throw "service 'kaitu' not registered by the installer" }
          Write-Host "service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status), expected Running" }

      - name: Launch the app with WebView2 remote debugging
        shell: pwsh
        run: |
          Get-Process Kaitu -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $p = Start-Process -FilePath "C:\Program Files\Kaitu\Kaitu.exe" -PassThru
          Write-Host "launched pid $($p.Id)"
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "the app exited immediately with $($p.ExitCode)" }

      # The assertion the blank-window bug would have failed. See the script
      # header for why a log line or the ui_boot_ok handshake is not enough.
      - name: UI actually rendered
        shell: pwsh
        run: node scripts/ci/windows/assert-ui-rendered.mjs 9222 120

      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== processes ==="
          Get-Process Kaitu, k2 -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "=== sc query kaitu ==="
          sc.exe query kaitu
          foreach ($n in @("desktop.log", "k2-service-install.log", "kaitu-preinstall.log", "install-diag.log")) {
            $hits = Get-ChildItem -Path "C:\ProgramData\kaitu", "$env:LOCALAPPDATA", "$env:TEMP", "C:\Program Files\Kaitu" `
                      -Filter $n -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hits) {
              Write-Host "=== $($hits.FullName) (tail 80) ==="
              Get-Content $hits.FullName -Tail 80
            } else {
              Write-Host "=== $n : not found ==="
            }
          }

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          Get-Process Kaitu -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = "C:\Program Files\Kaitu\uninstall.exe"
          if (Test-Path $u) {
            $p = Start-Process -FilePath $u -ArgumentList '/S' -Wait -PassThru
            Write-Host "uninstaller exit: $($p.ExitCode)"
          } else {
            Write-Host "no uninstaller at $u"
          }
