name: Test Webapp (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # k2 is a private submodule. webapp/src/services/__tests__/
      # k2-engine-codes.test.ts cross-checks ENGINE_ERROR_CODES against
      # k2/engine/error.go and used to `skipIf` the file was absent — which it
      # always was here, so that gate had never run in CI (ErrCodeTimeout=408
      # shipped that way). It now fails closed, so this init is load-bearing:
      # every caller must pass `secrets: inherit` (ci.yml, build-mobile.yml,
      # release-desktop.yml). Only k2 itself is needed — one Go file — so no
      # --recursive and no kuic key.
      - name: Setup SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.K2_DEPLOY_KEY }}

      - name: Init k2 submodule (engine error-code gate reads k2/engine/error.go)
        run: git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init k2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Run webapp tests (vitest)
        run: yarn test
        working-directory: webapp

      # Brand is baked at build time (K2_BRAND -> __K2_BRAND__), so the run above
      # only ever exercises kaitu. Every overleap-specific regression this project
      # has shipped was invisible to a kaitu-only run.
      - name: Run webapp tests (vitest, overleap brand)
        run: yarn test
        working-directory: webapp
        env:
          K2_BRAND: overleap

      - name: Type-check webapp (tsc)
        run: npx tsc --noEmit
        working-directory: webapp

      # Purity can only be judged on a real dist. Every brand leak this project
      # has shipped (debug.html carrying kaitu.io into the overleap bundle, the
      # openwrt config missing __K2_BRAND__) was invisible to source-level checks
      # and to a build that merely exits 0 — the script has to grep the artifact.
      # ~85s for both builds; a leaked brand costs more than that.
      - name: Build webapp (kaitu) + brand purity gate
        run: yarn build && bash scripts/check-brand-purity.sh kaitu dist
        working-directory: webapp

      # Overwrites dist/ — must follow the kaitu check, not race it.
      - name: Build webapp (overleap) + brand purity gate
        run: yarn build && bash scripts/check-brand-purity.sh overleap dist
        working-directory: webapp
        env:
          K2_BRAND: overleap

      - name: Type-check K2 Plugin (mobile)
        run: npx tsc --noEmit
        working-directory: mobile/plugins/k2-plugin

      # --noEmit above proves src/ compiles; it says nothing about dist/, which
      # is what the webapp's tsc and the yarn `file:` copy actually consume and
      # which is committed by hand. Rebuild it and diff.
      - name: K2 Plugin dist is rebuilt from src
        run: bash scripts/check-k2-plugin-fresh.sh
