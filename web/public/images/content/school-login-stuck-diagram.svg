<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="900" height="330" rx="16" fill="#f8fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="22" font-weight="600" fill="#0f172a">为什么学校系统「打得开，却登不进去」</text>

  <!-- step 1 -->
  <rect x="40" y="90" width="230" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="155" y="130" font-size="19" text-anchor="middle" fill="#0f172a">① 打开学校系统</text>
  <text x="155" y="160" font-size="15" text-anchor="middle" fill="#475569">ManageBac / Toddle …</text>
  <rect x="105" y="172" width="100" height="22" rx="11" fill="#dcfce7"/>
  <text x="155" y="188" font-size="14" text-anchor="middle" fill="#15803d">通常能打开</text>

  <line x1="275" y1="145" x2="330" y2="145" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 2 -->
  <rect x="335" y="90" width="230" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="130" font-size="19" text-anchor="middle" fill="#0f172a">② 点「用 Google 登录」</text>
  <text x="450" y="160" font-size="15" text-anchor="middle" fill="#475569">页面要跳去另一个网站</text>
  <text x="450" y="186" font-size="14" text-anchor="middle" fill="#64748b">accounts.google.com</text>

  <line x1="570" y1="145" x2="625" y2="145" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 3 -->
  <rect x="630" y="90" width="230" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="745" y="130" font-size="19" text-anchor="middle" fill="#991b1b">③ 一直转圈</text>
  <text x="745" y="160" font-size="15" text-anchor="middle" fill="#7f1d1d">Google 在国内受干扰</text>
  <text x="745" y="186" font-size="14" text-anchor="middle" fill="#7f1d1d">卡的是这一步，不是学校</text>

  <!-- fix -->
  <path d="M450 205 L450 240 L160 240 L160 262" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect x="40" y="265" width="820" height="46" rx="10" fill="#dcfce7"/>
  <text x="60" y="295" font-size="17" fill="#14532d">换个登录方式：用学校发的邮箱 + 密码，或者 Microsoft 账号，往往就能绕开第 ② 步</text>
</svg>
