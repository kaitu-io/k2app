<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k2 Stats</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #21262d}
.header h1{font-size:18px;font-weight:600;color:#f0f6fc}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;text-transform:uppercase}
.badge.healthy{background:#1b4332;color:#2dc653}
.badge.degraded{background:#3d2800;color:#d29922}
.badge.critical{background:#4a1520;color:#f85149}
.badge.offline{background:#21262d;color:#8b949e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px}
.card h2{font-size:13px;color:#8b949e;margin-bottom:8px;font-weight:500}
.card .value{font-size:24px;font-weight:600;color:#f0f6fc;margin-bottom:8px}
.card .value small{font-size:13px;color:#8b949e;font-weight:400}
canvas{width:100%;height:120px;display:block}
.info-row{display:flex;gap:20px;padding:8px 20px;border-top:1px solid #21262d}
.info-row .item{font-size:12px;color:#8b949e}
.info-row .item span{color:#c9d1d9;font-weight:500}
.events{padding:12px 20px}
.events h2{font-size:13px;color:#8b949e;margin-bottom:8px;font-weight:500}
.events .log{max-height:140px;overflow-y:auto;font-family:"SF Mono",Consolas,monospace;font-size:12px;line-height:1.6;color:#8b949e}
.events .log div{border-bottom:1px solid #161b22;padding:2px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <h1>k2 Wire Stats</h1>
  <span id="health" class="badge offline">offline</span>
  <span style="flex:1"></span>
  <span id="transport" style="font-size:12px;color:#8b949e"></span>
</div>
<div class="grid">
  <div class="card">
    <h2>Loss Rate</h2>
    <div class="value" id="v-loss"><small>%</small></div>
    <canvas id="c-loss"></canvas>
  </div>
  <div class="card">
    <h2>Throughput</h2>
    <div class="value" id="v-tp"><small>Mbps</small></div>
    <canvas id="c-tp"></canvas>
  </div>
  <div class="card">
    <h2>RTT</h2>
    <div class="value" id="v-rtt"><small>ms</small></div>
    <canvas id="c-rtt"></canvas>
  </div>
  <div class="card">
    <h2>Congestion Window</h2>
    <div class="value" id="v-cwnd"><small>KB</small></div>
    <canvas id="c-cwnd"></canvas>
  </div>
</div>
<div style="padding:0 20px 12px">
  <div class="card">
    <h2>Datagram Health</h2>
    <div style="display:flex;gap:32px;align-items:center;flex-wrap:wrap">
      <div>
        <div class="value" id="v-dgloss"><small>%</small></div>
        <div style="font-size:12px;color:#8b949e">Loss Rate</div>
      </div>
      <div>
        <div class="value" id="v-dgto" style="font-size:18px"></div>
        <div style="font-size:12px;color:#8b949e">Timeouts</div>
      </div>
      <div>
        <div class="value" id="v-dghops" style="font-size:18px"></div>
        <div style="font-size:12px;color:#8b949e">Hops</div>
      </div>
      <div style="flex:1;min-width:200px">
        <canvas id="c-dgloss"></canvas>
      </div>
    </div>
  </div>
</div>
<div class="info-row">
  <div class="item">Mode: <span id="v-mode"></span></div>
  <div class="item">TX: <span id="v-tx">0</span></div>
  <div class="item">RX: <span id="v-rx">0</span></div>
  <div class="item">Sending Rate: <span id="v-sr"></span></div>
</div>
<div class="events">
  <h2>Events</h2>
  <div class="log" id="log"></div>
</div>

<script>
(function(){
'use strict';
var MAX=300;
var series={loss:[],tp:[],rtt:[],cwnd:[],dgloss:[]};
var charts={};
var lastHealth='';

function initCanvas(id){
  var c=document.getElementById(id);
  var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  return{ctx:ctx,w:r.width,h:r.height};
}

function drawChart(id,data,color){
  if(!charts[id])charts[id]=initCanvas(id);
  var ch=charts[id];
  var ctx=ch.ctx,w=ch.w,h=ch.h;
  ctx.clearRect(0,0,w,h);
  if(data.length<2)return;
  var n=data.length;
  var mx=0;
  for(var i=0;i<n;i++)if(data[i]>mx)mx=data[i];
  mx=mx*1.2||1;
  ctx.beginPath();
  ctx.strokeStyle=color;ctx.lineWidth=1.5;
  ctx.moveTo(0,h-data[0]/mx*h);
  for(var j=1;j<n;j++){
    ctx.lineTo(j/(n-1)*w,h-data[j]/mx*h);
  }
  ctx.stroke();
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
  ctx.fillStyle=color+'18';ctx.fill();
}

function formatBytes(b){
  if(b<1024)return b+'B';
  if(b<1048576)return(b/1024).toFixed(1)+'KB';
  if(b<1073741824)return(b/1048576).toFixed(1)+'MB';
  return(b/1073741824).toFixed(2)+'GB';
}

var modeNames=['SlowStart','Decision','RateAdj'];

function setText(id,text){document.getElementById(id).textContent=text}

function push(s){
  var loss=s.loss_rate*100;
  var tp=s.throughput/1e6;
  var rtt=s.rtt_ms;
  var cwnd=s.cwnd/1024;

  series.loss.push(loss);
  series.tp.push(tp);
  series.rtt.push(rtt);
  series.cwnd.push(cwnd);
  for(var k in series)if(series[k].length>MAX)series[k].shift();

  setText('v-loss',loss.toFixed(2)+' %');
  setText('v-tp',tp.toFixed(2)+' Mbps');
  setText('v-rtt',rtt.toFixed(1)+' ms');
  setText('v-cwnd',cwnd.toFixed(0)+' KB');
  setText('v-mode',modeNames[s.mode]||String(s.mode));
  setText('v-tx',formatBytes(s.tx_bytes));
  setText('v-rx',formatBytes(s.rx_bytes));
  setText('v-sr',(s.sending_rate/1e6).toFixed(2)+' Mbps');
  setText('transport',s.transport||'');

  var dgloss=(s.dg_loss_rate||0)*100;
  setText('v-dgloss',dgloss.toFixed(1)+' %');
  setText('v-dgto',String(s.dg_timeouts||0));
  setText('v-dghops',String(s.dg_hops||0)+' / 3');
  series.dgloss.push(dgloss);
  if(series.dgloss.length>MAX)series.dgloss.shift();

  if(s.dg_hops>0&&s.dg_hops>(window._lastDgHops||0)){
    addLog('#d29922','Datagram hop #'+s.dg_hops);
  }
  window._lastDgHops=s.dg_hops||0;

  var hb=document.getElementById('health');
  hb.textContent=s.health||'offline';
  hb.className='badge '+(s.health||'offline');

  if(s.health&&s.health!==lastHealth){
    var color=s.health==='healthy'?'#2dc653':s.health==='degraded'?'#d29922':'#f85149';
    addLog(color,'Health: '+s.health);
    lastHealth=s.health;
  }
}

function addLog(color,msg){
  var el=document.getElementById('log');
  var d=document.createElement('div');
  var t=new Date().toLocaleTimeString();
  var dot=document.createElement('span');
  dot.style.color=color;dot.textContent='\u25CF ';
  var ts=document.createElement('span');
  ts.style.color='#484f58';ts.textContent=t+' ';
  d.appendChild(dot);d.appendChild(ts);d.appendChild(document.createTextNode(msg));
  el.insertBefore(d,el.firstChild);
  while(el.children.length>50)el.removeChild(el.lastChild);
}

function render(){
  drawChart('c-loss',series.loss,'#f85149');
  drawChart('c-tp',series.tp,'#58a6ff');
  drawChart('c-rtt',series.rtt,'#d29922');
  drawChart('c-cwnd',series.cwnd,'#2dc653');
  drawChart('c-dgloss',series.dgloss,'#d29922');
  requestAnimationFrame(render);
}

fetch('/api/stats').then(function(r){return r.json()}).then(function(resp){
  if(resp.data&&resp.data.length){
    for(var i=0;i<resp.data.length;i++)push(resp.data[i]);
    addLog('#58a6ff','Loaded '+resp.data.length+' history samples');
  }
}).catch(function(){});

var es=new EventSource('/api/events');
es.addEventListener('stats',function(e){
  try{push(JSON.parse(e.data))}catch(err){}
});
es.addEventListener('status',function(e){
  try{
    var s=JSON.parse(e.data);
    if(s.state==='disconnected'){
      document.getElementById('health').textContent='offline';
      document.getElementById('health').className='badge offline';
      addLog('#8b949e','Disconnected');
    }
  }catch(err){}
});

requestAnimationFrame(render);

window.addEventListener('resize',function(){
  for(var k in charts)charts[k]=null;
});
})();
</script>
</body>
</html>
